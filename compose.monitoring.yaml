services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kuma-prometheus
    restart: unless-stopped
    volumes:
      - monitoring_configs:/configs:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/configs/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - kuma-net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: kuma-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - kuma-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: kuma-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - kuma-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: kuma-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - kuma-net

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: kuma-mysqld-exporter
    restart: unless-stopped
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - "--mysqld.address=mariadb:3306"
      - "--mysqld.username=${MYSQL_USER}"
    ports:
      - "9104:9104"
    networks:
      - kuma-net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: kuma-blackbox-exporter
    restart: unless-stopped
    volumes:
      - monitoring_configs:/configs:ro
    command:
      - "--config.file=/configs/blackbox.yaml"
    ports:
      - "9115:9115"
    networks:
      - kuma-net

volumes:
  monitoring_configs:
  prometheus_data:
  grafana_data:

networks:
  kuma-net:
    external: true