global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. Самомониторинг Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. Метрики хоста
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # 3. Метрики Docker-контейнеров (CPU, RAM, Network)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # 4. Метрики базы данных MariaDB
  - job_name: "mariadb"
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # 5. Проверка доступности и latency веб-интерфейса Uptime Kuma
  - job_name: "blackbox-uptime-kuma"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://uptime-kuma:3001
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115